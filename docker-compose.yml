# Local Odoo 19 Community for developing and testing the TapRadar addons.
# Not used on Odoo.sh. Start: docker compose up -d  ->  http://localhost:8069
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data

  odoo:
    image: odoo:19.0
    depends_on:
      - db
    ports:
      - "127.0.0.1:8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - ./:/mnt/extra-addons:ro
      - odoo19-data:/var/lib/odoo

volumes:
  db-data:
  odoo19-data:
